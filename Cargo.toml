[package]
name = "candle-tray"
version = "0.1.0"
edition = "2024"
description = "Control the brightness of your monitors from the Windows tray"
license = "MIT"
repository = "https://github.com/vertopolkaLF/candle-tray"
readme = "README.md"
keywords = ["brightness", "ddc", "windows", "tray", "gpui"]
categories = ["gui"]

[dependencies]
anyhow = "1"
chrono = "0.4"
tempfile = "3"
directories = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
gpui = { version = "0.2.2", default-features = false }
futures = "0.3"
raw-window-handle = "0.6"
resvg = { version = "0.45", default-features = false }
smallvec = "1"
unicode-segmentation = "1"
fluent-bundle = "0.16"
unic-langid = "0.9"

[target.'cfg(windows)'.dependencies]
# windows-rs is pinned to one commit so windows-core, windows and
# windows-numerics always resolve to matching versions.
windows-core = { git = "https://github.com/microsoft/windows-rs", rev = "07f344c019b8fdae4d398d4c2591596044cb416a" }
windows-numerics = { git = "https://github.com/microsoft/windows-rs", rev = "07f344c019b8fdae4d398d4c2591596044cb416a" }
tray-icon = { version = "0.24", default-features = false }
windows = { git = "https://github.com/microsoft/windows-rs", rev = "07f344c019b8fdae4d398d4c2591596044cb416a", default-features = false, features = [
    "std",
    "Foundation",
    "Graphics_Effects",
    "System",
    "UI_Composition",
    "UI_Composition_Desktop",
    "UI_ViewManagement",
    "Win32_Devices_Display",
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Power",
    "Win32_System_Rpc",
    "Win32_System_Variant",
    "Win32_System_Wmi",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Composition",
    "Win32_System_WinRT_Graphics_Direct2D",
    "Win32_UI_WindowsAndMessaging",
] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Security", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Accessibility", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
fluent-syntax = "0.12"

[build-dependencies]
winresource = "0.1"

[lints.clippy]
# GPUI builders thread many callbacks and snapshot fields through one call.
too_many_arguments = "allow"

[profile.release]
lto = "thin"
strip = true
panic = "abort"

# Keep application code debuggable while optimizing the renderer and its hot
# dependencies so popup animations stay smooth in dev builds.
[profile.dev.package]
gpui = { opt-level = 3 }
taffy = { opt-level = 3 }
resvg = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
ttf-parser = { opt-level = 3 }

# GPUI 0.2.2 with its Windows blend state fixed to composite alpha (see the
# `codex-minibar patch` notes in vendor/gpui). Translucent windows otherwise
# draw anti-aliased edges as gray hairlines.
[patch.crates-io]
gpui = { path = "vendor/gpui" }
